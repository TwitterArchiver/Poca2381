  日全食时的日冕
  <br/>
  只有在日全食转瞬即逝的黑暗中，太阳的日冕才清晰可见。通常被明亮的太阳圆盘所掩盖，广阔而迷人的日冕令人心驰神往。然而，日冕中微妙的细节和极端的亮度范围，尽管肉眼可辨，却极难拍摄。然而，这张图片通过多张影像和数字处理技术，呈现了 2023 年 4 月 20 日澳大利亚埃克斯茅斯日全食期间拍摄的太阳日冕精细图像。清晰可见的是由炽热气体与磁场不断混合形成的复杂层次和发光焦散线。太阳边缘附近，明亮的环形日珥呈现粉红色。
